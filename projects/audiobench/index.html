<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <title>AudioBench</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css?v=261126-5">
  <script src="data/matrix-site-data.js?v=261126-5"></script>
  <script defer src="assets/site.js?v=261126-5"></script>
</head>
<body>
  <main class="page">
    <form class="filters" id="filters">
      <label>模型<select name="model"></select></label>
      <label>权重<select name="variant"></select></label>
      <label>数据集<select name="dataset"></select></label>
      <button class="download" id="export" type="button">下载 CSV</button>
    </form>
    <div class="legend" aria-label="数据状态">
      <span><i class="status-mark complete">✓</i>已评测</span>
      <span><i class="status-mark not_evaluated">…</i>待评测</span>
      <span><i class="status-mark not_applicable">—</i>不适用</span>
    </div>
    <div class="table-frame">
      <table id="coverage-table"></table>
    </div>
  </main>
</body>
</html>
