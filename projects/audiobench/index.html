<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AudioBench 微调结果与方法">
  <title>AudioBench · 微调结果</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#results">AudioBench</a>
    <nav class="page-tabs" aria-label="页面">
      <a href="#results" data-page-link="results">结果</a>
      <a href="#methods" data-page-link="methods">方法</a>
    </nav>
  </header>
  <main id="main-content">
    <section class="page" data-page="results">
      <div class="primary-switch" id="experiment-tabs">
        <button type="button" data-experiment="combined" class="active">联合微调</button>
        <button type="button" data-experiment="single">单数据集微调</button>
      </div>
      <section class="control-panel">
        <div class="control-row" id="combined-controls">
          <label>模型<select id="combined-model"></select></label>
        </div>
        <div class="single-picker" id="single-controls" hidden>
          <div class="matrix-title">模型 × 训练数据集 <small>可多选</small></div>
          <div class="single-matrix" id="single-matrix"></div>
          <div class="selection-count" id="selection-count"></div>
        </div>
        <div class="control-group">
          <span class="control-label">分组</span>
          <div class="button-tabs" id="group-tabs">
            <button type="button" data-group="cohort" class="active">疾病 / 健康</button>
            <button type="button" data-group="label">标签</button>
            <button type="button" data-group="model">模型</button>
            <button type="button" data-group="dataset">数据集</button>
            <button type="button" data-group="severity">严重程度</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label">指标</span>
          <div class="button-tabs" id="metric-tabs">
            <button type="button" data-metric="wer" class="active">WER</button>
            <button type="button" data-metric="cer">CER</button>
            <button type="button" data-metric="ser">SER</button>
            <button type="button" data-metric="semscore">SemScore</button>
            <button type="button" data-metric="s_rate">替换 S</button>
            <button type="button" data-metric="d_rate">删除 D</button>
            <button type="button" data-metric="i_rate">插入 I</button>
          </div>
        </div>
      </section>
      <section class="result-head" id="result-head"></section>
      <section class="chart-panel" id="result-chart"></section>
      <section class="table-panel">
        <div class="section-heading"><h2>数据</h2><button type="button" id="download-current">下载 CSV</button></div>
        <div class="table-scroll" id="result-table"></div>
      </section>
    </section>

    <section class="page" data-page="methods" hidden>
      <div class="primary-switch" id="method-tabs">
        <button type="button" data-method="combined" class="active">联合微调</button>
        <button type="button" data-method="single">单数据集微调</button>
      </div>
      <section id="method-content"></section>
      <section class="references-section">
        <div class="section-heading"><h2>参考文献</h2><small id="reference-count"></small></div>
        <div class="reference-list" id="reference-list"></div>
      </section>
    </section>
  </main>
  <footer>AudioBench · 2026</footer>
  <script src="data/result-browser-data.js"></script>
  <script src="data/site-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
