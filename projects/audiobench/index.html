<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <title>AudioBench</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css?v=261126-10">
  <script src="data/matrix-site-data.js?v=261126-10"></script>
  <script defer src="assets/site.js?v=261126-10"></script>
</head>
<body>
  <main class="page">
    <nav class="view-tabs" role="tablist" aria-label="数据页面">
      <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="results-view" id="results-tab">筛选数据</button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="inventory-view" id="inventory-tab">有哪些数据</button>
    </nav>

    <section class="view" id="results-view" role="tabpanel" aria-labelledby="results-tab">
      <form class="filters results-filters" id="filters">
        <label>范围<select name="scope"><option value="overall">整体</option><option value="severity">严重度分组</option><option value="assistive">辅助性场景</option></select></label>
        <fieldset class="model-picker"><legend>模型</legend><label class="select-all"><input id="all-models" type="checkbox" checked>全选</label><div id="model-options"></div></fieldset>
        <label id="dataset-wrap">评测集<select name="dataset"></select></label>
        <label>权重<select name="variant"></select></label>
        <label>人群<select name="cohort"><option value="all">全部</option><option value="disease">疾病组</option><option value="healthy">健康组</option></select></label>
        <label>指标<select name="metric"><option value="wer">WER</option><option value="cer">CER</option><option value="ser">SER</option><option value="semscore">SemScore</option></select></label>
        <label id="dimension-wrap" hidden>场景数据<select name="dimension"><option value="overall">场景汇总</option><option value="scene">按场景</option><option value="dataset">按来源数据集</option></select></label>
        <label id="group-wrap" hidden>分组<select name="group"></select></label>
      </form>
      <div class="table-heading">
        <p id="result-count" aria-live="polite"></p>
        <button class="download" id="export" type="button">下载筛选 CSV</button>
      </div>
      <div class="table-frame result-frame">
        <table id="result-table"></table>
        <p id="empty" hidden>没有匹配数据</p>
      </div>
    </section>

    <section class="view" id="inventory-view" role="tabpanel" aria-labelledby="inventory-tab" hidden>
      <form class="filters inventory-filters" id="inventory-filters">
        <label>模型<select name="model"></select></label>
        <label>权重<select name="variant"></select></label>
        <label>数据集<select name="dataset"></select></label>
      </form>
      <div class="legend" aria-label="数据状态">
        <span><i class="status-mark complete">✓</i>已评测</span>
        <span><i class="status-mark not_evaluated">…</i>待评测</span>
        <span><i class="status-mark not_applicable">—</i>不适用</span>
      </div>
      <div class="table-frame matrix-frame">
        <table id="coverage-table"></table>
      </div>
    </section>
  </main>
</body>
</html>
