<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AudioBench 模型、微调权重与数据集统一对照">
  <title>AudioBench · 模型 × 权重 × 数据集</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css?v=matrix-20261029-2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">AudioBench</a>
    <span class="site-subtitle">模型 × 权重变式 × 数据集</span>
  </header>
  <main id="main-content">
    <section class="control-panel matrix-controls" aria-label="结果筛选">
      <div class="control-group">
        <span class="control-label">范围</span>
        <div class="button-tabs" id="scope-tabs">
          <button type="button" data-scope="overall" class="active">整体</button>
          <button type="button" data-scope="assistive">辅助性</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">分组</span>
        <div class="button-tabs" id="group-tabs">
          <button type="button" data-group="none" class="active">不分组</button>
          <button type="button" data-group="model">按模型</button>
          <button type="button" data-group="dataset">按数据集</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">指标</span>
        <div class="button-tabs" id="metric-tabs">
          <button type="button" data-metric="wer" class="active">WER</button>
          <button type="button" data-metric="semscore">SemScore</button>
        </div>
      </div>
    </section>

    <section class="result-head" id="result-head"></section>
    <section class="status-legend" aria-label="图例">
      <span><i class="heat-swatch heat-good"></i>相对改善</span>
      <span><i class="heat-swatch heat-bad"></i>相对下降</span>
      <span><i class="heat-swatch heat-base"></i>原始权重</span>
      <span>单元格：指标值（相对原始权重变化）</span>
    </section>

    <section id="result-content" aria-live="polite"></section>
  </main>
  <footer>AudioBench · 数据更新时间见页面顶部</footer>
  <script src="data/matrix-site-data.js?v=matrix-20261029-2"></script>
  <script src="assets/app.js?v=matrix-20261029-2"></script>
</body>
</html>
