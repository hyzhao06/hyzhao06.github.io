<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>AudioBench｜病理语音识别评测</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css?v=261126-3">
  <script src="data/matrix-site-data.js?v=261126-3"></script>
  <script defer src="assets/site.js?v=261126-3"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <h1>病理语音识别评测</h1>
      </div>
      <p class="dataset-count" id="dataset-count"></p>
    </header>

    <nav class="view-tabs" role="tablist" aria-label="数据视图">
      <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="results-view" id="results-tab">评测结果</button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="coverage-view" id="coverage-tab">数据覆盖</button>
    </nav>

    <section class="view" id="results-view" role="tabpanel" aria-labelledby="results-tab">
      <form class="filters" id="filters">
        <label>范围<select name="scope"><option value="overall">整体</option><option value="severity">严重度分组</option><option value="assistive">辅助场景</option></select></label>
        <label>模型<select name="model"></select></label>
        <label>评测数据集<select name="dataset"></select></label>
        <label>权重<select name="variant"></select></label>
        <label>人群<select name="cohort"><option value="all">全部</option><option value="disease">疾病组</option><option value="healthy">健康组</option></select></label>
        <label id="dimension-wrap" hidden>辅助场景<select name="dimension"><option value="overall">全部场景</option><option value="scene">按场景</option><option value="dataset">按来源数据集</option></select></label>
        <label id="group-wrap" hidden>分组<select name="group"></select></label>
      </form>
      <div class="table-heading">
        <p id="result-count" aria-live="polite"></p>
        <button id="export" type="button" class="download">下载筛选结果 CSV</button>
      </div>
      <div class="table-frame" id="results-frame">
        <table id="result-table"></table>
        <p id="empty" hidden>没有符合条件的结果。</p>
      </div>
      <div class="pagination" id="pagination" hidden>
        <button id="previous" type="button">上一页</button>
        <span id="page-indicator"></span>
        <button id="next" type="button">下一页</button>
      </div>
    </section>

    <section class="view" id="coverage-view" role="tabpanel" aria-labelledby="coverage-tab" hidden>
      <div class="coverage-heading">
        <label>模型<select id="coverage-model"></select></label>
        <p id="coverage-count"></p>
      </div>
      <div class="table-frame coverage-frame">
        <table id="coverage-table"></table>
      </div>
      <div class="legend" aria-label="覆盖状态">
        <span><i class="status-mark complete">✓</i>已评测</span>
        <span><i class="status-mark not_evaluated">…</i>待评测</span>
        <span><i class="status-mark not_applicable">—</i>不适用</span>
      </div>
    </section>
  </main>
</body>
</html>
