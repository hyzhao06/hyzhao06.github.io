  <header class="topbar">

      <div class="control-group">
        <span class="control-label">范围</span>

        </div>
      </div>
      <div class="control-group">
        <span class="control-label">指标</span>
        <div class="button-tabs" id="metric-tabs">
          <button type="button" data-metric="wer" class="active">WER</button>
          <button type="button" data-metric="semscore">SemScore</button>
        </div>
      </div>
    </section>

    <aside class="experiment-note" aria-label="新微调结果说明">
      <strong>完整录音微调结果已更新</strong>
      <p>“GermanPD 微调（新）”和“PC-GITA 微调（新）”使用完整录音与完整参考文本训练，覆盖全部五个模型。旧微调方法与历史结果保留；跨数据集及辅助性组合尚未评测。</p>
