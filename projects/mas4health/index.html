<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAS4Health · 模型评估</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <main>
    <header class="page-heading"><h1>MAS4Health</h1></header>

    <div id="metric-buttons" class="metrics" role="group" aria-label="选择评估指标"></div>

    <section class="chart-panel" aria-label="各模型在不同数据集上的 Dice 折线图">
      <div class="chart-scroll">
        <canvas id="performance-chart" role="img" aria-label="横轴为数据集，纵轴为 Dice，每条折线表示一个模型"></canvas>
      </div>
      <div id="chart-legend" class="chart-legend"></div>
    </section>

    <section class="results" aria-label="模型与数据集结果">
      <div class="table-scroll" tabindex="0" aria-label="完整基准结果表，可横向滚动">
        <table id="benchmark-table" class="benchmark-table">
          <thead id="benchmark-head"></thead>
          <tbody id="benchmark-body"></tbody>
          <tfoot id="benchmark-foot"></tfoot>
        </table>
      </div>
    </section>

    <noscript>请启用 JavaScript 查看完整评估表。</noscript>
  </main>
  <script src="benchmark-data.js?v=7"></script>
  <script src="benchmark.js?v=7"></script>
</body>
</html>
