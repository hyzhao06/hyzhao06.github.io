<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAS4Health · 模型评估</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main>
    <header><h1>MAS4Health<span>模型评估</span></h1></header>
    <div id="metric-buttons" class="metrics" role="group" aria-label="选择评估指标"></div>
    <section aria-label="模型与数据集评估结果">
      <div class="table-scroll" tabindex="0" aria-label="结果表，可横向滚动">
        <table class="heatmap">
          <thead><tr>
            <th scope="col">模型</th>
            <th scope="col">KiTS23<span>CT · 肾肿瘤 · 489 例</span></th>
            <th scope="col">LiTS17<span>CT · 肝肿瘤 · 131 例</span></th>
            <th scope="col">BraTS 2021<span>FLAIR · 全肿瘤 · 1,251 例</span></th>
            <th scope="col">MerlinPlus<span>CT · 腹部肿瘤 · 1,174 例</span></th>
          </tr></thead>
          <tbody id="heatmap-body"></tbody>
        </table>
      </div>
      <div class="table-note"><span>申请：MerlinPlus CT 访问待批准。SegVol 仅支持 CT。</span><span class="scale">较差 <i></i> 较好</span></div>
    </section>
    <section class="method" aria-label="当前指标计算方法" aria-live="polite" aria-atomic="true">
      <div class="method-heading"><h2 id="method-name"></h2><span id="metric-description"></span></div>
      <p id="method-formula" class="formula"></p>
      <p id="method-explanation"></p>
      <p id="method-aggregation"></p>
    </section>
    <noscript>请启用 JavaScript 查看评估数据和切换指标。</noscript>
  </main>
  <script src="benchmark.js?v=3"></script>
</body>
</html>
